<svg width="900" height="700" viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" role="img">
<title>3-tier Docker app on AWS - architecture diagram</title>
<desc>GitHub feeds a deploy script on an EC2 instance. Inside EC2, an Nginx reverse proxy receives user traffic and routes it to a frontend container and a backend Flask container. The backend connects over TLS on port 3306 to an AWS RDS MySQL instance in a private subnet.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#8fb8e8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#7fd4a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="900" height="700" fill="#0d1420"/>

<!-- User -->
<circle cx="450" cy="45" r="20" fill="none" stroke="#c7d2e0" stroke-width="1.5"/>
<circle cx="450" cy="38" r="7" fill="none" stroke="#c7d2e0" stroke-width="1.5"/>
<path d="M438 55 Q450 43 462 55" fill="none" stroke="#c7d2e0" stroke-width="1.5"/>
<text x="450" y="90" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c7d2e0">User</text>
<line x1="450" y1="98" x2="450" y2="128" stroke="#8fb8e8" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="466" y="118" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8fb8e8">HTTP / HTTPS</text>

<!-- GitHub box, top-left -->
<rect x="40" y="30" width="200" height="70" rx="10" fill="#141b2b" stroke="#3a4a63" stroke-width="1"/>
<text x="140" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6ecf5">GitHub</text>
<text x="140" y="80" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8b97ab">Source repo (main branch)</text>
<line x1="140" y1="100" x2="140" y2="150" stroke="#7fd4a8" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<text x="150" y="130" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#7fd4a8">git pull + deploy.sh</text>

<!-- EC2 instance security-group boundary -->
<rect x="60" y="150" width="780" height="330" rx="16" fill="none" stroke="#4a5a75" stroke-width="1" stroke-dasharray="6 5"/>
<text x="80" y="175" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8b97ab">Security group: three-tier-ec2-sg (22 admin, 80/443 public)</text>

<!-- EC2 instance -->
<rect x="90" y="190" width="720" height="270" rx="12" fill="#141b2b" stroke="#3a4a63" stroke-width="1"/>
<text x="112" y="216" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e6ecf5">EC2 instance</text>
<text x="112" y="234" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8b97ab">Docker + Docker Compose</text>

<!-- Nginx reverse proxy -->
<rect x="350" y="250" width="200" height="60" rx="10" fill="#1c2a41" stroke="#4f80c4" stroke-width="1.2"/>
<text x="450" y="275" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e6ecf5">Nginx</text>
<text x="450" y="294" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9db6d9">reverse proxy :80</text>

<line x1="450" y1="128" x2="450" y2="250" stroke="#8fb8e8" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Frontend container -->
<rect x="150" y="380" width="220" height="60" rx="10" fill="#1c2a41" stroke="#4f80c4" stroke-width="1.2"/>
<text x="260" y="405" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e6ecf5">Frontend container</text>
<text x="260" y="424" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9db6d9">static UI, served by nginx</text>

<!-- Backend container -->
<rect x="530" y="380" width="220" height="60" rx="10" fill="#1c2a41" stroke="#4f80c4" stroke-width="1.2"/>
<text x="640" y="405" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e6ecf5">Backend container</text>
<text x="640" y="424" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9db6d9">Flask API (gunicorn) :5000</text>

<!-- proxy to frontend -->
<path d="M350 280 L260 280 L260 380" fill="none" stroke="#8fb8e8" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="270" y="330" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8fb8e8">/</text>

<!-- proxy to backend -->
<path d="M550 280 L640 280 L640 380" fill="none" stroke="#8fb8e8" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="600" y="330" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8fb8e8">/api/*</text>

<!-- RDS security-group boundary -->
<rect x="290" y="540" width="320" height="130" rx="16" fill="none" stroke="#4a5a75" stroke-width="1" stroke-dasharray="6 5"/>
<text x="310" y="565" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8b97ab">Security group: three-tier-rds-sg (3306 from EC2 SG only)</text>

<!-- RDS -->
<rect x="330" y="580" width="240" height="70" rx="10" fill="#152219" stroke="#4f9f6f" stroke-width="1.2"/>
<text x="450" y="608" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e6ecf5">AWS RDS MySQL</text>
<text x="450" y="627" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9dd9b6">private subnet, not publicly accessible</text>

<line x1="640" y1="440" x2="640" y2="500" stroke="#8fb8e8" stroke-width="1.5"/>
<path d="M640 500 L450 500 L450 578" fill="none" stroke="#8fb8e8" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="452" y="516" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8fb8e8">3306 (TLS)</text>

<!-- Legend -->
<rect x="40" y="670" width="14" height="14" rx="3" fill="#1c2a41" stroke="#4f80c4"/>
<text x="60" y="681" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8b97ab">Docker container</text>
<rect x="200" y="670" width="14" height="14" rx="3" fill="#152219" stroke="#4f9f6f"/>
<text x="220" y="681" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8b97ab">Managed AWS service</text>
</svg>
